baseURL: https://akashark.github.io/
title: Sharker / Notes
theme: mana
# Keep /en/ URLs so existing article links remain valid; the interface is Chinese.
defaultContentLanguage: en
defaultContentLanguageInSubdir: true
locale: zh-CN
languages:
  en:
    label: 简体中文
    locale: zh-CN
    weight: 1
hasCJKLanguage: true
enableEmoji: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
pagination:
  pagerSize: 12
outputs:
  home: [HTML, RSS, JSON]
taxonomies:
  category: categories
  tag: tags
  series: series
menus:
  main:
    - name: 文章
      pageRef: /posts
      weight: 10
    - name: 专题
      pageRef: /series
      weight: 20
    - name: 标签
      pageRef: /tags
      weight: 30
    - name: 归档
      pageRef: /archives
      weight: 40
    - name: 关于
      pageRef: /about
      weight: 50
params:
  description: 记录技术实践、阅读笔记，以及生活中的思考。
  author: Sharker
  heroTitleLine1: SHARKER
  heroTitleLine2: 思考，构建，记录。
  favicon: /favicon.svg
  enableIntegrity: true
  relatedPostsCount: 3
  footerText: 用文字沉淀思考 · Hugo & Mana
  custom404Message: 这篇内容可能已整理或移动，试试搜索或文章归档。
  rssAuthor:
    name: Sharker
    email: 1548742234@qq.com
  avatar:
    assetPath: images/sharker-mark.svg
  social:
    github: https://github.com/AkaShark
    email: 1548742234@qq.com
  copyright:
    startYear: 2022
    owner: Sharker
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true
  highlight:
    codeFences: true
    guessSyntax: true
    noClasses: false
    lineNos: false
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false
related:
  includeNewer: true
  indices:
    - name: tags
      weight: 80
    - name: series
      weight: 100
