{{ define "main" }}<div class="archives-page"><header class="archives-header"><p class="eyebrow">THE ARCHIVE</p><h1 class="archives-title">文章归档</h1><p class="archives-description">按发表时间，回看每一步积累。</p></header><div class="archives-content">{{ range (where site.RegularPages "Type" "posts").ByDate.Reverse.GroupByDate "2006" }}<section class="archive-year"><h2 class="archive-year-title">{{ .Key }} <small> / {{ len .Pages }} 篇</small></h2><ul class="archive-posts">{{ range .Pages }}<li class="archive-post-item"><time class="archive-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "01-02" }}</time><a class="archive-link" href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}</ul></section>{{ end }}</div></div>{{ end }}
